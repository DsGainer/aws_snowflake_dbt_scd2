name: 'dbt_scdtype2_workshop'
version: '1.0.0'
config-version: 2

profile: 'default'   # must match the profile name in profiles.yml (see note 1)

vars:

   wrk_schema: BRONZE

   file_format_json: MYDB.BRONZE.MY_CSV_FORMAT

   purge_status: FALSE

   stage_name: MYDB.BRONZE.S3_TEST_STAGE

   rawhist_db: MYDB

   
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_scdtype2_workshop:
    example:
      +schema: example

    silver:
      +schema: silver
      +materialized: table

    gold:
      +schema: gold
      +materialized: view

